[workspace]
resolver = "2"
members = [
    "crates/agent-runtime",
    "crates/agent-session",
    "crates/agent-tools",
    "crates/review-agent",
    "crates/git-core",
    "crates/git-engine",
    "crates/app-service",
    "crates/ipc-types",
    "app/src-tauri",
]

# 统一管理依赖版本:子 crate 用 `xxx.workspace = true` 引用,
# 保证整个项目所有 crate 用的是同一个版本,避免版本碎片。
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
lru = "0.12"
similar = "2"
base64 = "0.22"
ts-rs = "10"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync", "time", "process", "io-util", "net"] }
regex = "1"
fs2 = "0.4"
tempfile = "3"
