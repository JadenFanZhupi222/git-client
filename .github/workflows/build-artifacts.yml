name: Build Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.mode.outputs.should-release }}
    steps:
      - name: Detect release mode
        id: mode
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/app-v* ]]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse prerelease
        if: steps.mode.outputs.should-release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; artifacts will be replaced."
          else
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
              --title "Git Client ${GITHUB_REF_NAME#app-v}" \
              --notes "Cross-platform Git Client bundles. Code signing, notarization, and updater metadata are included when the required secrets are configured." \
              --prerelease
          fi

  tauri:
    name: Tauri(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: release
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINT: ${{ secrets.TAURI_UPDATER_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: tauri-linux
          - os: macos-latest
            artifact-name: tauri-macos
          - os: windows-latest
            artifact-name: tauri-windows

    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend deps
        run: pnpm -C app install --frozen-lockfile

      - name: Resolve signing mode
        id: signing
        shell: pwsh
        run: |
          $args = @()
          $hasUpdaterArtifacts = $env:TAURI_SIGNING_PRIVATE_KEY -and $env:TAURI_UPDATER_PUBKEY

          if ($env:RUNNER_OS -eq "Windows") {
            $hasTrustedSigning = $env:AZURE_CLIENT_ID `
              -and $env:AZURE_CLIENT_SECRET `
              -and $env:AZURE_TENANT_ID `
              -and $env:AZURE_TRUSTED_SIGNING_ENDPOINT `
              -and $env:AZURE_TRUSTED_SIGNING_ACCOUNT `
              -and $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE

            if ($hasTrustedSigning) {
              cargo install artifact-signing-cli
              $config = @{
                bundle = @{
                  windows = @{
                    signCommand = "trusted-signing-cli -e `"$env:AZURE_TRUSTED_SIGNING_ENDPOINT`" -a `"$env:AZURE_TRUSTED_SIGNING_ACCOUNT`" -c `"$env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE`" -d `"Git Client`" %1"
                  }
                }
              } | ConvertTo-Json -Depth 5
              Set-Content -Path signing.windows.conf.json -Value $config -Encoding UTF8
              $args += "--config signing.windows.conf.json"
              Write-Host "Windows Azure Trusted Signing is enabled."
            } elseif ($hasUpdaterArtifacts) {
              Write-Host "Windows code signing secrets are incomplete, but updater signing is enabled."
            } else {
              $args += "--no-sign"
              Write-Host "Windows signing secrets are incomplete; building unsigned bundles."
            }
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $hasCertificate = $env:APPLE_CERTIFICATE -and $env:APPLE_CERTIFICATE_PASSWORD
            $hasAppleIdNotarization = $env:APPLE_ID -and $env:APPLE_PASSWORD -and $env:APPLE_TEAM_ID

            if ($hasCertificate -and $hasAppleIdNotarization) {
              Write-Host "macOS code signing and notarization are enabled."
            } elseif ($hasUpdaterArtifacts) {
              Write-Host "macOS code signing/notarization secrets are incomplete, but updater signing is enabled."
            } else {
              $args += "--no-sign"
              Write-Host "macOS signing/notarization secrets are incomplete; building unsigned bundles."
            }
          } else {
            if ($hasUpdaterArtifacts) {
              Write-Host "Linux updater signing is enabled."
            } else {
              $args += "--no-sign"
              Write-Host "Linux signing is not configured yet; building unsigned bundles."
            }
          }

          "build-args=$($args -join ' ')" >> $env:GITHUB_OUTPUT

      - name: Resolve updater mode
        id: updater
        shell: pwsh
        run: |
          $args = @()
          $hasUpdaterArtifacts = $env:TAURI_SIGNING_PRIVATE_KEY -and $env:TAURI_UPDATER_PUBKEY

          if ($hasUpdaterArtifacts) {
            $endpoint = $env:TAURI_UPDATER_ENDPOINT
            if (-not $endpoint) {
              $endpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
            }

            $config = @{
              bundle = @{
                createUpdaterArtifacts = $true
              }
              plugins = @{
                updater = @{
                  pubkey = $env:TAURI_UPDATER_PUBKEY
                  endpoints = @($endpoint)
                  windows = @{
                    installMode = "passive"
                  }
                }
              }
            } | ConvertTo-Json -Depth 8
            Set-Content -Path updater.conf.json -Value $config -Encoding UTF8
            $args += "--config updater.conf.json"
            "has-updater-artifacts=true" >> $env:GITHUB_OUTPUT
            Write-Host "Updater artifacts are enabled. Endpoint: $endpoint"
          } else {
            "has-updater-artifacts=false" >> $env:GITHUB_OUTPUT
            Write-Host "Updater secrets are incomplete; updater artifacts and latest.json are disabled."
          }

          "build-args=$($args -join ' ')" >> $env:GITHUB_OUTPUT

      - name: Build Tauri bundle
        if: needs.release.outputs.should-release != 'true'
        run: pnpm -C app tauri build --ci ${{ steps.signing.outputs.build-args }} ${{ steps.updater.outputs.build-args }}

      - name: Upload bundle artifacts
        if: needs.release.outputs.should-release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/src-tauri/target/release/bundle/**/*
            target/release/bundle/**/*

      - name: Build and upload GitHub Release assets
        if: needs.release.outputs.should-release == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Git Client ${{ github.ref_name }}
          releaseBody: Cross-platform Git Client bundles. Signed update artifacts are included when updater secrets are configured.
          prerelease: true
          uploadUpdaterJson: ${{ steps.updater.outputs.has-updater-artifacts }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.artifact-name }}
          updaterJsonPreferNsis: true
          args: --ci ${{ steps.signing.outputs.build-args }} ${{ steps.updater.outputs.build-args }}
