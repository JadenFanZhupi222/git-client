name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: fmt --check
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: dependency boundaries
        shell: pwsh
        run: ./scripts/check-dependency-boundaries.ps1

  frontend:
    name: Frontend(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        run: pnpm -C app install --frozen-lockfile

      - name: Release validator tests
        run: node --test scripts/release-preflight.test.mjs

      - name: Bundle budget tests
        run: node --test scripts/check-bundle-size.test.mjs

      - name: Test
        run: pnpm -C app test

      - name: Type-check and build
        run: pnpm -C app build

  desktop-e2e:
    name: Desktop E2E(${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev xvfb

      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        run: pnpm -C app install --frozen-lockfile

      - name: Test E2E fixtures
        run: cargo test -p app --features e2e e2e_fixture

      - name: Build desktop test binary
        run: pnpm -C app e2e:build

      - name: Run desktop commit workflow
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm -C app e2e
          else
            pnpm -C app e2e
          fi

      - name: Upload desktop E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-failure-${{ runner.os }}
          path: app/.e2e-tmp/**
          if-no-files-found: warn
          retention-days: 7
