# CI 卡口:每次 push / PR 都跑同一套质量门,锁住本地的 fmt/clippy/test/类型 纪律。
# 两个 job 并行:rust(后端工作区) 与 frontend(TS 类型检查 + 前端构建)。
name: CI

on:
  push:
  pull_request:

# 同一分支新 push 时,取消仍在跑的旧 CI,省额度也更快拿到最新结果。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust(fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # app/src-tauri 是工作区成员,clippy/test 会编译 Tauri 外壳,
      # 因此 Linux 上必须先装 WebKitGTK 等系统依赖(对齐 README 1.3)。
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev build-essential curl wget file libssl-dev libxdo-dev

      # 不指定版本:rustup 读 rust-toolchain.toml 自动切到 1.89.0 并装齐 clippy/rustfmt。
      - name: Show toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: fmt --check
        run: cargo fmt --all --check

      - name: clippy(警告即失败)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  frontend:
    name: Frontend(test + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 必须指定 pnpm 版本:action 默认读「根目录」package.json 的 packageManager,
      # 而本项目 package.json 在 app/,根目录没有 → 这里显式给版本(对齐本地 10.29.2)。
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.2

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install deps
        run: pnpm -C app install --frozen-lockfile

      # vitest:纯逻辑(mergeModel / graphGeometry)+ 组件回归(比较页默认两端)。
      - name: Test
        run: pnpm -C app test

      # build = `tsc && vite build`:tsc 即类型卡口,vite build 确保产物可构建。
      - name: Type-check & build
        run: pnpm -C app build
